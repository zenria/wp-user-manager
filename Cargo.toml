[package]
name = "wp-user-manager"
version = "0.1.0"
edition = "2024"
description = "CLI tool to reconcile WordPress users against a reference list of e-mail addresses"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dotenvy = "0.15"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "query",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
